services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: parts_finder
      MYSQL_USER: parts_finder
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./docker/backend
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: parts_finder
      DB_USERNAME: parts_finder
      DB_PASSWORD: secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./docker/frontend
    working_dir: /app
    environment:
      # Used during SSR inside the container network
      NUXT_API_BASE: http://backend:8000/api
      # Used by the browser on the host
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    depends_on:
      - backend

volumes:
  db-data:
  frontend-node-modules:
  frontend-nuxt:
